plugins { id 'com.android.application' }
def creatorTools = providers.gradleProperty('creatorTools').map { it.toBoolean() }.getOrElse(false)
android {
    namespace 'net.tacademy.attendance'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'net.tacademy.attendance'
        minSdk 26
        targetSdk 36
        versionCode 28
        versionName '0.9.13'
        buildConfigField 'boolean', 'CREATOR_TOOLS', creatorTools.toString()
        manifestPlaceholders = [creatorToolsEnabled: creatorTools.toString()]
        testInstrumentationRunner 'net.tacademy.attendance.DeviceChecks'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
