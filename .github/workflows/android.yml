name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - audience: public
            creatorTools: false
          - audience: creator
            creatorTools: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Tests, lint and APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PcreatorTools=${{ matrix.creatorTools }}
      - name: Log analysis tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: matrix.audience == 'public'
        with:
          name: classroom-attendance-${{ matrix.audience }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
